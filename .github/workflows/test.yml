name: Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        
    - name: Install dependencies
      run: npm install
      
    - name: Run Unit and Integration Tests
      run: npm run test:coverage

    # ── Chrome Build ──────────────────────────────────────────────────────────
    - name: Build Chrome Extension
      run: npm run build:chrome

    - name: Upload Chrome artifact
      uses: actions/upload-artifact@v4
      with:
        name: extension-chrome
        path: release/chrome/extension-chrome.zip
        if-no-files-found: error

    # ── Firefox Build ─────────────────────────────────────────────────────────
    - name: Build Firefox Extension
      run: npm run build:firefox

    - name: Upload Firefox artifact
      uses: actions/upload-artifact@v4
      with:
        name: extension-firefox
        path: release/firefox/extension-firefox.zip
        if-no-files-found: error

    # ── Safari Build ──────────────────────────────────────────────────────────
    # Note: build:safari only runs the webpack step (produces dist/safari/).
    # The xcrun safari-web-extension-packager step (release:safari) requires macOS
    # with Xcode installed. That step is intentionally run manually on a mac or via
    # a separate macOS CI job — not here on ubuntu-latest.
    - name: Build Safari Extension (webpack bundle only)
      run: npm run build:safari

    - name: Upload Safari webpack bundle artifact
      uses: actions/upload-artifact@v4
      with:
        name: extension-safari-dist
        path: dist/safari/
        if-no-files-found: error

    # ── Artifact Isolation Audit ──────────────────────────────────────────────
    # Verifies:
    #   - Chrome: no Firefox/Safari-only strings, contains Chrome strings
    #   - Firefox: no Chrome/Safari-only strings, contains Firefox strings
    #   - Safari: JS isolation (dist built above), manifest validation
    - name: Verify artifact isolation (Chrome ↔ Firefox ↔ Safari)
      run: npm run check:isolation

    # ── E2E Tests (Chrome only — Playwright Chromium) ─────────────────────────
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
      
    - name: Run E2E Tests
      run: npx playwright test
      
    # ── Reports ───────────────────────────────────────────────────────────────
    - name: Upload Coverage
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage/
        
    - name: Upload Playwright Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
