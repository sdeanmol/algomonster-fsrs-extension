<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!--
    CANVA PRINCIPLE #3 — MAKE IT MEMORABLE
    Unexpected combination = stickiness. A light bulb (the "aha/recall" moment) 
    whose filament IS the FSRS memory decay curve. No other extension uses this.
    One clear concept, instantly understood, impossible to confuse with any other tool.
    At 16×16: glowing bulb silhouette. At 128: the filament curve is visible.
  -->
  <defs>
    <radialGradient id="bulbGlow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow03m">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background: deep indigo -->
  <rect width="128" height="128" rx="22" fill="#1e1b4b"/>

  <!-- Bulb glow aura -->
  <circle cx="64" cy="52" r="36" fill="url(#bulbGlow)" opacity="0.35"/>

  <!-- Bulb glass outline -->
  <path d="
    M46 56
    C46 40 54 28 64 28
    C74 28 82 40 82 56
    C82 66 76 74 72 80
    L56 80
    C52 74 46 66 46 56 Z
  " stroke="#fbbf24" stroke-width="3" fill="#1e1b4b" filter="url(#glow03m)"/>

  <!-- Base rings -->
  <rect x="54" y="80" width="20" height="5" rx="1" fill="#fbbf24" opacity="0.7"/>
  <rect x="56" y="87" width="16" height="5" rx="1" fill="#fbbf24" opacity="0.5"/>
  <rect x="58" y="94" width="12" height="4" rx="1" fill="#fbbf24" opacity="0.4"/>

  <!-- Filament = FSRS decay + recovery curve (the memorable twist) -->
  <path d="M54 72 C56 68 56 60 60 56 C62 50 58 40 64 36 C70 40 66 50 68 56 C72 60 72 68 74 72"
        stroke="#fef08a" stroke-width="2.5" stroke-linecap="round" fill="none" filter="url(#glow03m)"/>
</svg>
