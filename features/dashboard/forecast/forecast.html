<!--
  @file features/dashboard/forecast/forecast.html
  @context Options / Dedicated Tab UI
  @description Review Forecast page — projects 30-day spaced repetition review workload distributions with daily average/peak stats, bar chart, and interactive calendar cells.
  @linked-scripts features/common/theme-sync.js, features/dashboard/forecast/forecast.ts (compiled to forecast.js)
  @linked-styles features/common/base.css, features/dashboard/forecast/forecast.css
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>AlgoRecall — Review Forecast</title>
    <script src="../../common/theme-sync.js"></script>
    <link rel="stylesheet" href="../../common/base.css">
    <link rel="stylesheet" href="forecast.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-main">
                <div class="algorecall-brand-badge">
                    <svg class="svg-icon logo-icon algorecall-brand-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-2.5 2.5C6 22 4 19.5 4 17c0-1.5 1-2.5 1-3.5 0-1-1-2-1-3.5 0-2.5 2-5 5.5-6z"></path>
                        <path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 2.5 2.5C18 22 20 19.5 20 17c0-1.5-1-2.5-1-3.5 0-1 1-2 1-3.5 0-2.5-2-5-5.5-6z"></path>
                        <path d="M12 8h2M12 12h3M12 16h2M10 8h2M9 12h3M10 16h2"></path>
                    </svg>
                    <span class="algorecall-brand-name">AlgoRecall</span>
                </div>
                <h1>Review Forecast</h1>
                <!-- Subtitle updated with total card count by forecast.ts -->
                <p class="subtitle" id="forecast-subtitle">Loading...</p>
            </div>
            <div class="header-actions">
                <a href="../popup/popup.html" class="btn btn-secondary">
                    <svg class="svg-icon" viewBox="0 0 24 24" style="margin-right: 6px;" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                    Back to Dashboard
                </a>
            </div>
        </div>

        <!-- Summary Cards: 30-day forecast overview metrics -->
        <div class="forecast-summary">
            <div class="summary-card">
                <div class="summary-value" id="forecast-total">-</div>
                <div class="summary-label">Next 30 Days</div>
            </div>
            <div class="summary-card">
                <div class="summary-value" id="forecast-avg">-</div>
                <div class="summary-label">Daily Average</div>
            </div>
            <div class="summary-card">
                <div class="summary-value" id="forecast-peak">-</div>
                <div class="summary-label">Peak Day</div>
            </div>
            <div class="summary-card">
                <div class="summary-value" id="forecast-today">-</div>
                <div class="summary-label">Due Today</div>
            </div>
        </div>

        <!-- Forecast Chart: Daily workload bar chart injected by forecast.ts -->
        <div id="forecast-chart-wrapper" class="panel chart-panel" style="margin-bottom: 24px; display: none;">
            <!-- Workload forecast bar chart will be injected here -->
        </div>

        <!-- Calendar Grid: 30-day scheduled review calendar matrix -->
        <div class="forecast-calendar" id="forecast-calendar">
            <!-- Dynamically generated by forecast.ts renderCalendar() -->
        </div>
    </div>

    <!-- Forecast controller script -->
    <script src="forecast.js"></script>
</body>
</html>
